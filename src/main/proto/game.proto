syntax = "proto3";

package wordy;

option java_package = "com.team2.wordy.proto";
option java_outer_classname = "GameProto";
option java_multiple_files = true;

// ── Import shared messages from common.proto ───
import "common.proto";

// ─────────────────────────────────────────────
//  GAME SERVICE  (updated per professor feedback)
//
//  - PlayGame is now UNARY
//  - Word submission is its own RPC: SubmitWord
//  - WaitingTimer is its own RPC (10-second lobby countdown)
//  - RoundTimer is its own RPC (30-second round countdown)
// ─────────────────────────────────────────────

service GameService {

  // Step 1: Player starts or joins a game
  rpc StartGame     (StartGameRequest)     returns (StartGameResponse);

  // Step 2: Lobby countdown (poll repeatedly)
  rpc WaitingTimer  (WaitingTimerRequest)  returns (WaitingTimerResponse);

  // Step 3: Get current round letters + scores
  rpc PlayGame      (PlayGameRequest)      returns (PlayGameResponse);

  // Step 4: Submit a word during an active round
  rpc SubmitWord    (SubmitWordRequest)    returns (SubmitWordResponse);

  // Step 5: Round countdown (poll repeatedly)
  rpc RoundTimer    (RoundTimerRequest)    returns (RoundTimerResponse);

  // Step 6: Get round/game result after timer expires
  rpc GetRoundResult (GetRoundResultRequest) returns (GetRoundResultResponse);

  // Leaderboard — "View Top Players" home screen option
  rpc GetTopPlayers (GetTopPlayersRequest) returns (GetTopPlayersResponse);
}

// ── StartGame ──────────────────────────────────

message StartGameRequest {
  string token = 1;  // session token from AuthService (common.proto)
}

message StartGameResponse {
  bool   success    = 1;
  string message    = 2;  // "Waiting for players..." | "Game started!" | error
  string session_id = 3;  // unique game session ID used in all other RPCs
}

// ── WaitingTimer ───────────────────────────────

message WaitingTimerRequest {
  string token      = 1;
  string session_id = 2;
}

message WaitingTimerResponse {
  int32  seconds_remaining = 1;  // counts down from join_wait_seconds to 0
  bool   game_ready        = 2;  // true = second player joined, game can start
  bool   cancelled         = 3;  // true = timer expired, nobody joined
}

// ── PlayGame (unary) ───────────────────────────

message PlayGameRequest {
  string token        = 1;
  string session_id   = 2;
  int32  round_number = 3;
}

message PlayGameResponse {
  bool            success          = 1;
  string          message          = 2;
  int32           round_number     = 3;
  repeated string letters          = 4;  // exactly 20 letters (5-7 vowels)
  int32           duration_seconds = 5;  // round duration from TimeConfig
  repeated PlayerScore scores      = 6;  // PlayerScore imported from common.proto
}

// ── SubmitWord ─────────────────────────────────

message SubmitWordRequest {
  string token        = 1;
  string session_id   = 2;
  int32  round_number = 3;
  string word         = 4;
}

message SubmitWordResponse {
  bool   valid   = 1;  // false = too short, not in words.txt, or unformable
  string message = 2;  // "Valid word!" | "Invalid - too short" | "Invalid word"
  string word    = 3;  // echoed back so client knows which submission this is for
}

// ── RoundTimer ─────────────────────────────────

message RoundTimerRequest {
  string token        = 1;
  string session_id   = 2;
  int32  round_number = 3;
}

message RoundTimerResponse {
  int32  seconds_remaining = 1;  // counts down from round_duration_seconds to 0
  bool   round_active      = 2;  // false = round ended, call GetRoundResult
}

// ── GetRoundResult ─────────────────────────────

message GetRoundResultRequest {
  string token        = 1;
  string session_id   = 2;
  int32  round_number = 3;
}

message GetRoundResultResponse {
  bool   success      = 1;
  int32  round_number = 2;
  string winner       = 3;  // round winner username; empty = no winner (tie)
  string winning_word = 4;  // the longest valid word that won the round
  repeated PlayerScore scores = 5;  // PlayerScore imported from common.proto
  bool   game_over    = 6;  // true = a player reached 3 round wins
  string game_winner  = 7;  // overall winner username (empty if game not over)
}

// ── GetTopPlayers ──────────────────────────────

message GetTopPlayersRequest {
  string token = 1;
}

message GetTopPlayersResponse {
  repeated TopWinEntry  top_winners = 1;  // top 5 by all-time game wins
  repeated TopWordEntry top_words   = 2;  // top 5 longest words ever submitted
}

// TopWinEntry and TopWordEntry are imported from common.proto
// PlayerScore is imported from common.proto
// Do NOT redefine them here.
