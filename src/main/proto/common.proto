syntax = "proto3";

package wordy;

option java_package = "com.team2.wordy.proto";
option java_outer_classname = "CommonProto";
option java_multiple_files = true;

// ─────────────────────────────────────────────
//  COMMON.PROTO
//
//  1. AuthService   — login and logout
//  2. Shared messages — reused across game.proto
//     and admin.proto so nothing is defined twice
// ─────────────────────────────────────────────

// ── Auth Service ───────────────────────────────

service AuthService {

  // Player or admin login.
  // Server checks credentials against MySQL and enforces single-session.
  // If account is already logged in, previous session is disconnected.
  rpc Login  (LoginRequest)  returns (LoginResponse);

  // Logout the currently authenticated session.
  rpc Logout (LogoutRequest) returns (LogoutResponse);

  // Register for admin or guest.
  rpc Register (RegisterRequest) returns (RegisterResponse);
}

// ── Login ──────────────────────────────────────

message LoginRequest {
  string username = 1;
  string password = 2;  // plaintext; server hashes and compares
}

message LoginResponse {
  bool   success = 1;
  string message = 2;  // "Login successful" | "Invalid credentials"
                       // | "Account already logged in — previous session disconnected"
  string role    = 3;  // "PLAYER" | "ADMIN"  (empty on failure)
  string token   = 4;  // session token for all future RPCs (empty on failure)
}

// ── Logout ─────────────────────────────────────

message LogoutRequest {
  string token = 1;  // session token issued at login
}

message LogoutResponse {
  bool   success = 1;
  string message = 2;  // "Logged out successfully"
}

// ── Register ───────────────────────────────────

message RegisterRequest {
  string username = 1;
  string password = 2;
  // No role field here. Server strictly assigns PLAYER
}

message RegisterResponse {
  bool   success = 1;
  string message = 2;
  string role    = 3;  // "PLAYER" | "ADMIN"
  string token   = 4;
}

// ─────────────────────────────────────────────
//  SHARED MESSAGES
//  Used by both game.proto and admin.proto.
//  Define once here, import everywhere.
// ─────────────────────────────────────────────

// Represents one player's score within a game session
message PlayerScore {
  string username   = 1;
  int32  round_wins = 2;
}

// Represents a player account (no password — never sent to client)
message PlayerRecord {
  int32  id       = 1;
  string username = 2;
  string role     = 3;  // "PLAYER" | "ADMIN"
  bool archived   = 4;
}

// Leaderboard entries
message TopWinEntry {
  string username  = 1;
  int32  win_count = 2;
}

message TopWordEntry {
  string word         = 1;
  int32  word_length  = 2;
  string submitted_by = 3;
}
